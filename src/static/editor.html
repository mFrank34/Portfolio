<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editor — Admin</title>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/base.css?v=1" />
  <link rel="stylesheet" href="/css/editor.css?v=1" />
  <script defer src="/js/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js"
    integrity="sha512-ytM6hP1K9BkRTjUQZpxZKFjJ2TvE4QXaK7phVymsm7NimaI5H09TWWW6f2JMbonLp4ftYU6xfwQGoe3C8jta9A=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"
    integrity="sha512-pSeTnZAQF/RHxb0ysMoYQI/BRZsa5XuklcrgFfU3YZIdnD3LvkkqzrIeHxzFi6gKtI8Cpq2DEWdZjMTcNVhUYA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.0/purify.min.js"
    integrity="sha512-ZCsRHqhdDXrq4iTXVZLkGBsOfDlvhvHhEMQlCosf9Oqy1p6xizF1LSWa6uuISGqeh9PmCzfneGcYZvc9t/hjaQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/js/editor.js"></script>
</head>

<body class="editor" x-data="editor()" x-init="init()">
  <div class="dashboard">
    <aside class="sidebar">
      <a href="/" class="back-link">← Back home</a>
      <nav>
        <button :class="{active: section==='page'}" @click="section='page'">Page</button>
        <button :class="{active: section==='blog'}" @click="section='blog'">Blog Posts</button>
        <button :class="{active: section==='project'}" @click="section='project'">Projects</button>
        <button :class="{active: section==='skills'}" @click="section='skills'">Skills</button>
        <button :class="{active: section==='socials'}" @click="section='socials'">Socials</button>
      </nav>
      <button class="logout" @click="logout">Log out</button>
    </aside>

    <main class="focus-panel">

      <!-- PAGE -->
      <section x-show="section==='page'">
        <h2>Front Page Content</h2>
        <label>Hero Title <input type="text" x-model="page.hero_title" /></label>
        <label>Hero Subtitle <input type="text" x-model="page.hero_subtitle" /></label>
        <label>Content (Markdown)
          <textarea x-model="page.content" rows="12"></textarea>
        </label>
        <div class="actions">
          <button @click="savePage" :disabled="!canSubmitPage">Save</button>
          <button @click="pagePreview = renderMarkdown(page.content)">Preview</button>
        </div>
        <p :class="['status', pageStatusType]" x-text="pageStatus"></p>
        <template x-if="pagePreview">
          <div class="preview" x-html="pagePreview"></div>
        </template>
      </section>

      <!-- BLOG -->
      <section x-show="section==='blog'">
        <h2 x-text="editingBlogId ? 'Edit Post' : 'New Post'"></h2>
        <label>Title <input type="text" x-model="blog.title" /></label>
        <label>Content (Markdown)
          <textarea x-model="blog.content_md" rows="12"></textarea>
        </label>
        <div class="actions">
          <button @click="createBlog" :disabled="!canSubmitBlog" x-text="editingBlogId ? 'Update' : 'Publish'"></button>
          <button @click="blogPreview = renderMarkdown(blog.content_md)">Preview</button>
          <button x-show="editingBlogId" @click="cancelEditBlog()">Cancel</button>
        </div>
        <p :class="['status', blogStatusType]" x-text="blogStatus"></p>
        <template x-if="blogPreview">
          <div class="preview" x-html="blogPreview"></div>
        </template>

        <h3>Existing Posts</h3>
        <div class="manage-list">
          <template x-for="p in posts" :key="p.id">
            <div class="manage-item">
              <span x-text="p.title"></span>
              <div class="manage-actions">
                <button @click="startEditBlog(p)">Edit</button>
                <button @click="deleteBlog(p.id)">Delete</button>
              </div>
            </div>
          </template>
        </div>
      </section>

      <!-- PROJECT -->
      <section x-show="section==='project'">
        <h2 x-text="editingProjectId ? 'Edit Project' : 'New Project'"></h2>
        <label>Title <input type="text" x-model="project.title" /></label>
        <label>Description <textarea x-model="project.description" rows="6"></textarea></label>
        <label>Tech stack (comma separated) <input type="text" x-model="project.tech_stack" /></label>
        <label>URL <input type="url" x-model="project.url" /></label>
        <div class="actions">
          <button @click="createProject" :disabled="!canSubmitProject"
            x-text="editingProjectId ? 'Update' : 'Create'"></button>
          <button x-show="editingProjectId" @click="cancelEditProject()">Cancel</button>
        </div>
        <p :class="['status', projectStatusType]" x-text="projectStatus"></p>

        <h3>Existing Projects</h3>
        <div class="manage-list">
          <template x-for="pr in projectsList" :key="pr.id">
            <div class="manage-item">
              <span x-text="pr.title"></span>
              <div class="manage-actions">
                <button @click="startEditProject(pr)">Edit</button>
                <button @click="deleteProject(pr.id)">Delete</button>
              </div>
            </div>
          </template>
        </div>
      </section>

      <!-- SKILLS -->
      <section x-show="section==='skills'">
        <h2 x-text="editingSkillId ? 'Edit Skill' : 'Add Skill'"></h2>
        <label>Name <input type="text" x-model="newSkill" /></label>
        <label>Category <input type="text" x-model="newSkillCategory" /></label>
        <label>Level <input type="text" x-model="newSkillLevel" /></label>
        <div class="actions">
          <button @click="saveSkill" :disabled="!newSkill.trim()" x-text="editingSkillId ? 'Update' : 'Add'"></button>
          <button x-show="editingSkillId" @click="cancelEditSkill()">Cancel</button>
        </div>
        <p :class="['status', skillsStatusType]" x-text="skillsStatus"></p>

        <h3>Existing Skills</h3>
        <div class="manage-list">
          <template x-for="s in skills" :key="s.id">
            <div class="manage-item">
              <span>
                <strong x-text="s.name"></strong>
                <span x-show="s.category" x-text="' (' + s.category + ')'"></span>
              </span>
              <div class="manage-actions">
                <button @click="startEditSkill(s)">Edit</button>
                <button @click="deleteSkill(s.id)">Delete</button>
              </div>
            </div>
          </template>
        </div>
      </section>

      <!-- SOCIALS -->
      <section x-show="section==='socials'">
        <h2 x-text="editingSocialId ? 'Edit Social' : 'Add Social'"></h2>
        <label>Site <input type="text" x-model="newSite" /></label>
        <label>URL <input type="url" x-model="newLink" /></label>
        <label>Icon <input type="text" x-model="newIcon" /></label>
        <div class="actions">
          <button @click="saveSocial" :disabled="!newSite.trim() || !newLink.trim() || !newIcon.trim()"
            x-text="editingSocialId ? 'Update' : 'Add'"></button>
          <button x-show="editingSocialId" @click="cancelEditSocial()">Cancel</button>
        </div>
        <p :class="['status', socialsStatusType]" x-text="socialsStatus"></p>

        <h3>Existing Socials</h3>
        <div class="manage-list">
          <template x-for="s in socials" :key="s.id">
            <div class="manage-item">
              <span x-text="s.site"></span>
              <div class="manage-actions">
                <button @click="startEditSocial(s)">Edit</button>
                <button @click="deleteSocial(s.id)">Delete</button>
              </div>
            </div>
          </template>
        </div>
      </section>

    </main>
  </div>
</body>

</html>
