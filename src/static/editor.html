<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editor — Admin</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js"></script>
  <!-- Markdown renderer and sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="editor.js"></script>
</head>

<body class="editor" x-data="editor()">
  <header>
    <a href="/">← Back home</a>
    <h1>Content Editor</h1>
    <button @click="toggleTheme" aria-label="Toggle theme">
      <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
    </button>
  </header>

  <main>
    <section class="controls">
      <label>
        Write Key
        <input type="password" x-model="writeKey" placeholder="Enter write key" />
      </label>

      <div class="tabs">
        <button :class="{active: tab==='blog'}" @click="tab='blog'">New Blog Post</button>
        <button :class="{active: tab==='project'}" @click="tab='project'">New Project</button>
        <button :class="{active: tab==='manage'}" @click="tab='manage'; loadManage()">Manage</button>
      </div>
    </section>

    <section x-show="tab==='blog'" class="form-section">
      <h2>Create Blog Post</h2>
      <label>Title
        <input type="text" x-model="blog.title" placeholder="Post title" />
      </label>
      <label>Content (Markdown)
        <textarea x-model="blog.content_md" rows="12" placeholder="Write markdown here..."></textarea>
      </label>

      <div class="actions">
        <button @click="createBlog" :disabled="!canSubmitBlog">Publish</button>
        <button @click="previewBlog">Preview</button>
      </div>

      <p :class="['status', blogStatusType]" x-text="blogStatus"></p>

      <template x-if="blogPreview">
        <section class="preview">
          <h3>Preview</h3>
          <div x-html="blogPreview"></div>
        </section>
      </template>
    </section>

    <section x-show="tab==='project'" class="form-section">
      <h2>Create Project</h2>
      <label>Title
        <input type="text" x-model="project.title" placeholder="Project title" />
      </label>
      <label>Description
        <textarea x-model="project.description" rows="6" placeholder="Short description"></textarea>
      </label>
      <label>Tech stack (comma separated)
        <input type="text" x-model="project.tech_stack" placeholder="e.g. Python, FastAPI" />
      </label>
      <label>URL
        <input type="url" x-model="project.url" placeholder="https://example.com" />
      </label>

      <div class="actions">
        <button @click="createProject" :disabled="!canSubmitProject">Create Project</button>
        <button @click="previewProject">Preview</button>
      </div>

      <p :class="['status', projectStatusType]" x-text="projectStatus"></p>

      <template x-if="projectPreview">
        <section class="preview">
          <h3>Project Preview</h3>
          <div>
            <h4 x-text="project.title"></h4>
            <div x-html="projectPreview"></div>
            <div>
              <template x-for="t in project.tech_stack.split(',').map(s => s.trim()).filter(Boolean)">
                <span class="tag" x-text="t"></span>
              </template>
            </div>
            <a :href="project.url" x-show="project.url" target="_blank" rel="noopener noreferrer">Visit →</a>
          </div>
        </section>
      </template>
    </section>

    <section x-show="tab==='manage'" class="form-section">
      <h2>Manage Posts & Projects</h2>
      <div class="manage-columns">
        <div class="manage-list">
          <h3>Posts</h3>
          <p x-show="manageError && manageError.posts" x-text="manageError.posts"></p>
          <template x-for="p in posts" :key="p.id">
            <div class="manage-item">
              <strong x-text="p.title"></strong>
              <div class="manage-actions">
                <button @click="startEditBlog(p)">Edit</button>
                <button @click="deleteBlog(p.id)">Delete</button>
                <a :href="'/blog/' + p.slug" target="_blank" rel="noopener noreferrer">View</a>
              </div>
            </div>
          </template>
        </div>

        <div class="manage-list">
          <h3>Projects</h3>
          <p x-show="manageError && manageError.projects" x-text="manageError.projects"></p>
          <template x-for="pr in projectsList" :key="pr.id">
            <div class="manage-item">
              <strong x-text="pr.title"></strong>
              <div class="manage-actions">
                <button @click="startEditProject(pr)">Edit</button>
                <button @click="deleteProject(pr.id)">Delete</button>
                <a :href="'/project/' + pr.slug" target="_blank" rel="noopener noreferrer">View</a>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>

  </main>

</body>

</html>
