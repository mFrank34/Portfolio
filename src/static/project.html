<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/css/base.css?v=1" />
  <link rel="stylesheet" href="/css/home.css?v=1" />
  <script src="/js/theme.js"></script>
  <script src="/js/project.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js"></script>
</head>

<body x-data="projectApp()">
  <header>
    <a href="/">← Back home</a>
  </header>

  <article>
    <p x-show="loading">Loading...</p>
    <template x-if="project">
      <div>
        <h1 x-text="project.title"></h1>
        <p x-text="project.description"></p>
        <span class="tag" x-text="project.tech_stack"></span>
        <a :href="project.url" x-show="project.url" target="_blank">Visit →</a>
      </div>
    </template>
    <p x-show="!loading && !project">Project not found.</p>
  </article>
</body>

</html>
