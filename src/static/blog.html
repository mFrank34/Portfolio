<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Blog Post</title>
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/style.css?v=3">
  <script src="/theme.js"></script>
  <script src="/blog.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js"></script>
</head>

<body x-data="blogPostApp()">
  <header>
    <a href="/">← Back home</a>
  </header>

  <article>
    <p x-show="loading">Loading...</p>
    <template x-if="post">
      <div>
        <h1 x-text="post.title"></h1>
        <div x-html="post.content_html"></div>
      </div>
    </template>
    <p x-show="!loading && !post">Post not found.</p>
  </article>

</body>

</html>
