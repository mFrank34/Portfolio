<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Blog Post</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/css/base.css?v=1" />
  <link rel="stylesheet" href="/css/home.css?v=1" />
  <script src="/js/theme.js"></script>
  <script src="/js/blog.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body x-data="blogPostApp()">
  <header>
    <a href="/">← Back home</a>
  </header>

  <article>
    <p x-show="loading">Loading...</p>
    <template x-if="post">
      <div>
        <h1 x-text="post.title"></h1>
        <div x-html="post.content"></div>
      </div>
    </template>
    <p x-show="!loading && !post">Post not found.</p>
  </article>

  <footer>
    <p x-show="post?.updated_at">Last updated: <span x-text="formattedUpdatedAt"></span></p>
  </footer>

</body>

</html>
