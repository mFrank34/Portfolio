<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor — Admin</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js"></script>
    <!-- Markdown renderer and sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>

<body class="editor" x-data="editor()">
    <header>
        <a href="/">← Back home</a>
        <h1>Content Editor</h1>
    </header>

    <main>
        <section class="controls">
            <label>
                Write Key
                <input type="password" x-model="writeKey" placeholder="Enter write key" />
            </label>

            <div class="tabs">
                <button :class="{active: tab==='blog'}" @click="tab='blog'">New Blog Post</button>
                <button :class="{active: tab==='project'}" @click="tab='project'">New Project</button>
            </div>
        </section>

        <section x-show="tab==='blog'" class="form-section">
            <h2>Create Blog Post</h2>
            <label>Title
                <input type="text" x-model="blog.title" placeholder="Post title" />
            </label>
            <label>Content (Markdown)
                <textarea x-model="blog.content_md" rows="12" placeholder="Write markdown here..."></textarea>
            </label>

            <div class="actions">
                <button @click="createBlog" :disabled="!canSubmitBlog">Publish</button>
                <button @click="previewBlog">Preview</button>
            </div>

            <p :class="['status', blogStatusType]" x-text="blogStatus"></p>

            <template x-if="blogPreview">
                <section class="preview">
                    <h3>Preview</h3>
                    <div x-html="blogPreview"></div>
                </section>
            </template>
        </section>

        <section x-show="tab==='project'" class="form-section">
            <h2>Create Project</h2>
            <label>Title
                <input type="text" x-model="project.title" placeholder="Project title" />
            </label>
            <label>Description
                <textarea x-model="project.description" rows="6" placeholder="Short description"></textarea>
            </label>
            <label>Tech stack (comma separated)
                <input type="text" x-model="project.tech_stack" placeholder="e.g. Python, FastAPI" />
            </label>
            <label>URL
                <input type="url" x-model="project.url" placeholder="https://example.com" />
            </label>

            <div class="actions">
                <button @click="createProject" :disabled="!canSubmitProject">Create Project</button>
            </div>

            <p :class="['status', projectStatusType]" x-text="projectStatus"></p>
        </section>

    </main>

    <script>
        function editor() {
            return {
                tab: 'blog',
                writeKey: '',
                blog: { title: '', content_md: '' },
                project: { title: '', description: '', tech_stack: '', url: '' },
                blogStatus: '',
                projectStatus: '',
                blogStatusType: '',
                projectStatusType: '',
                blogPreview: '',

                get canSubmitBlog() {
                    return this.writeKey && this.blog.title && this.blog.content_md;
                },
                get canSubmitProject() {
                    return this.writeKey && this.project.title;
                },

                async createBlog() {
                    this.blogStatus = 'Publishing...';
                    this.blogStatusType = '';
                    try {
                        const res = await fetch('/api/blog', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-Write-Key': this.writeKey },
                            body: JSON.stringify({ title: this.blog.title, content_md: this.blog.content_md }),
                        });
                        if (!res.ok) {
                            const err = await res.json().catch(() => ({}));
                            this.blogStatus = 'Error: ' + (err.detail || res.statusText || res.status);
                            this.blogStatusType = 'error';
                            return;
                        }
                        const data = await res.json();
                        this.blogStatus = 'Published! View at /blog/' + data.slug;
                        this.blogStatusType = 'success';
                        // clear form but keep key
                        this.blog = { title: '', content_md: '' };
                        this.blogPreview = '';
                        this.tab = 'blog';
                    } catch (e) {
                        this.blogStatus = 'Network error: ' + e.message;
                        this.blogStatusType = 'error';
                    }
                },

                async previewBlog() {
                    const md = this.blog.content_md || '';
                    if (!md) { this.blogPreview = ''; return; }
                    try {
                        // use marked + DOMPurify from CDN
                        const raw = (typeof marked !== 'undefined') ? marked.parse(md) : md.replace(/\n/g, '<br/>');
                        const clean = (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(raw) : raw;
                        this.blogPreview = clean;
                    } catch (e) {
                        // Fallback: escape HTML and show plain text
                        this.blogPreview = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br/>');
                    }
                },


                async createProject() {
                    this.projectStatus = 'Creating project...';
                    this.projectStatusType = '';
                    try {
                        // normalize tech stack into a comma-separated, trimmed string
                        const techs = (this.project.tech_stack || '').split(',').map(s => s.trim()).filter(Boolean).join(', ');
                        // basic URL validation
                        let url = this.project.url || null;
                        if (url) {
                            try { new URL(url); } catch (e) { this.projectStatus = 'Error: invalid URL'; this.projectStatusType = 'error'; return; }
                        }
                        const payload = {
                            title: this.project.title,
                            description: this.project.description || null,
                            tech_stack: techs || null,
                            url: url || null,
                        };
                        const res = await fetch('/api/project', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-Write-Key': this.writeKey },
                            body: JSON.stringify(payload),
                        });
                        if (!res.ok) {
                            const err = await res.json().catch(() => ({}));
                            this.projectStatus = 'Error: ' + (err.detail || res.statusText || res.status);
                            this.projectStatusType = 'error';
                            return;
                        }
                        const data = await res.json();
                        this.projectStatus = 'Created! View at /project/' + data.slug;
                        this.projectStatusType = 'success';
                        this.project = { title: '', description: '', tech_stack: '', url: '' };
                    } catch (e) {
                        this.projectStatus = 'Network error: ' + e.message;
                        this.projectStatusType = 'error';
                    }
                }
            };
        }
    </script>

    <style>
        /* Minimal scoped styles for editor */
        body.editor {
            font-family: system-ui, Arial, sans-serif;
            padding: 1rem;
        }

        header {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem
        }

        main {
            max-width: 900px;
            margin: 0 auto
        }

        label {
            display: block;
            margin: 0.5rem 0
        }

        input[type="text"],
        input[type="url"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem
        }

        .tabs button {
            padding: 0.4rem 0.8rem
        }

        .tabs button.active {
            background: #222;
            color: #fff
        }

        .actions {
            margin-top: 0.5rem
        }

        .status {
            margin-top: 0.5rem
        }

        .status.success {
            color: #0a0
        }

        .status.error {
            color: #a00
        }

        .preview {
            border-top: 1px solid #eee;
            margin-top: 1rem;
            padding-top: 1rem
        }
    </style>
</body>

</html>
