<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frank's Portfolio</title>
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/css/base.css?v=1" />
  <link rel="stylesheet" href="/css/home.css?v=1" />
  <script src="/js/theme.js"></script>
  <script src="/js/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js"></script>
  <script src="/js/shooting-stars.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      shootingStars('stars-canvas', {
        spawnChance: 0.10,
        speed: 8,
      });
    });
  </script>
</head>

<body x-data="homeApp()" x-init="init()">
  <div class="shooting-stars-container">
    <canvas id="stars-canvas"></canvas>
  </div>
  <header>
    <h1 x-text="page?.hero_title || 'Frank'"></h1>
    <nav>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#blog">Blog</a>
      <a href="/cv" target="_blank" rel="noopener">CV</a>
      <a href="/login">Login</a>
      <button @click="toggleTheme" aria-label="Toggle theme"
        style="background: none; border: none; cursor: pointer; display: inline-flex; align-items: center; color: var(--nav-text); vertical-align: middle;">
        <!-- Sun icon (shown in dark mode) -->
        <svg x-show="theme === 'dark'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg x-show="theme === 'light'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </nav>
  </header>

  <!-- PAGE CONTENT -->
  <section id="hero" x-show="page">
    <p x-text="page?.hero_subtitle"></p>
    <div class="page-content" x-html="page?.content || ''"></div>
  </section>

  <!-- SOCIALS -->
  <section id="socials">
    <h2>Socials</h2>
    <div class="socials-list">
      <template x-for="s in socials" :key="s.id">
        <a class="socials-pill" :href="s.link" target="_blank" rel="noopener">
          <img :src="`https://cdn.simpleicons.org/${s.site.toLowerCase()}/${theme === 'dark' ? 'ffffff' : '000000'}`"
            :alt="s.site" class="socials-icon" width="18" height="18" />
          <span x-text="s.site"></span>
        </a>
      </template>
    </div>
  </section>

  <!-- SKILLS -->
  <section id="skills">
    <h2>Skills</h2>
    <div class="skills-list">
      <template x-for="s in skills" :key="s.id">
        <span class="skill-pill" x-text="s.name"></span>
      </template>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects">
    <h2>Projects</h2>
    <p x-show="loading">Loading projects...</p>
    <div class="grid">
      <template x-for="p in projects" :key="p.id">
        <div class="card">
          <a :href="'/project/' + p.slug" x-text="p.title"></a>
        </div>
      </template>
    </div>
  </section>

  <!-- BLOG -->
  <section id="blog">
    <h2>Blogs</h2>
    <div class="post-list">
      <template x-for="post in posts" :key="post.id">
        <article class="post-preview">
          <a :href="'/blog/' + post.slug" x-text="post.title"></a>
        </article>
      </template>
    </div>
  </section>

  <footer>
    <p x-show="page?.updated_at">Last updated: <span x-text="formattedUpdatedAt"></span></p>
  </footer>
</body>

</html>
