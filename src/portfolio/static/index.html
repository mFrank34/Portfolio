<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frank's Portfolio</title>
    <link rel="stylesheet" href="/style.css" />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js"
    ></script>
  </head>

  <body>
    <header>
      <h1>Frank</h1>
      <nav>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#blog">Blog</a>
        <a href="/cv.pdf" target="_blank" rel="noopener">CV</a>
      </nav>
    </header>

    <!-- SKILLS -->
    <section
      id="skills"
      x-data="{ skills: [] }"
      x-init="
      skills = await (await fetch('/api/skills')).json();
  "
    >
      <h2>Skills</h2>
      <div class="skills-list">
        <template x-for="s in skills" :key="s.id">
          <span class="skill-pill" x-text="s.name"></span>
        </template>
      </div>
    </section>

    <!-- PROJECTS -->
    <section
      id="projects"
      x-data="{ projects: [], loading: true }"
      x-init="
      projects = await (await fetch('/api/project')).json();
      loading = false;
  "
    >
      <h2>Projects</h2>
      <p x-show="loading">Loading projects...</p>
      <div class="grid">
        <template x-for="p in projects" :key="p.id">
          <div class="card">
            <a :href="'/project/' + p.slug" x-text="p.title"></a>
          </div>
        </template>
      </div>
    </section>

    <!-- BLOG -->
    <section
      id="blog"
      x-data="{ posts: [] }"
      x-init="
      posts = await (await fetch('/api/blog')).json();
  "
    >
      <h2>Blog</h2>
      <div class="post-list">
        <template x-for="post in posts" :key="post.id">
          <article class="post-preview">
            <a :href="'/blog/' + post.slug" x-text="post.title"></a>
          </article>
        </template>
      </div>
    </section>
  </body>
</html>
